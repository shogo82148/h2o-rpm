name: build

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - amazonlinux2
          - amazonlinux2023
          - almalinux8
          - almalinux9
          - rockylinux8
          - rockylinux9
        platform:
          - linux/amd64
          - linux/arm64
        exclude:
          - distribution: amazonlinux2023
            platform: linux/arm64

    steps:
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: |
          make ${{ matrix.distribution }}
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: test
        run: |
          make test-${{ matrix.distribution }}
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Configure AWS Credentials
        uses: fuller-inc/actions-aws-assume-role@db10fc9ddce76ac14ce9182c2433f497580bec93 # v1.9.2
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::445285296882:role/rpm-repository-users-H2ORole-MUDL8E8BJ1VS
          role-session-tagging: true
      - name: upload
        if: github.event_name == 'release'
        run: |
          make upload
