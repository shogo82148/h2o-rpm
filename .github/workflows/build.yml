name: build

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ${{ case(matrix.architecture == 'arm64', 'ubuntu-24.04-arm', 'ubuntu-24.04') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - amazonlinux2
          - amazonlinux2023
          - almalinux8
          - almalinux9
          - almalinux10
          - rockylinux8
          - rockylinux9
          - rockylinux10
        architecture:
          - amd64
          - arm64

    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: |
          make ${{ matrix.distribution }}
        env:
          PLATFORM: linux/${{ matrix.architecture }}

      - name: test
        run: |
          make test-${{ matrix.distribution }}
        env:
          PLATFORM: linux/${{ matrix.architecture }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::445285296882:role/rpm-repository-users-H2ORole-MUDL8E8BJ1VS
      - name: upload
        if: github.event_name == 'release'
        run: |
          make upload
