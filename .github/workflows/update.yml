name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "40 19 1 * *"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: generate
        uses: shogo82148/actions-github-app-token@v1.3.4
      - id: update
        name: update
        run: |
          ./scripts/update.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: shogo82148/actions-commit-and-create-pr@v1.1.4
        with:
          github-token: ${{ steps.generate.outputs.token }}
          commit-message: bump h2o ${{ steps.update.outputs.latest-version }}
